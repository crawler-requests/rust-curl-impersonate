[package]
name = "rust-curl-impersonate"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust rewrite of curl-impersonate: browser TLS and HTTP/2 fingerprints for all 48 curl-impersonate targets"
repository = "https://github.com/crawler-requests/rust-curl-impersonate"
rust-version = "1.85"

[dependencies]
wreq = { version = "6.0.0-rc.31", default-features = false, features = ["tokio-rt", "webpki-roots", "gzip", "brotli", "zstd", "deflate", "socks", "ws", "cookies", "json", "stream", "multipart"] }
tokio = { version = "1", features = ["rt", "macros"] }
brotli = "7"
flate2 = "1"
zstd = "0.13"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
