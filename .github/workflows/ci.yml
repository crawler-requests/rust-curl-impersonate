name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-test
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # Every record must come from a capture. This fails the build if one
      # names a raw file that does not exist, has no ClientHello, or claims a
      # header or HTTP/2 parameter the capture never contained.
      - name: Audit capture provenance
        run: python3 -I tools/audit_provenance.py

      # The agent entry point is a published URL other agents read, so what it
      # links must exist in the build: the skill mirror, the plugin archive, and
      # the two manifests that have to agree. `--live` is left to the release
      # checklist; here the files are checked without network access.
      - name: Agent entry point is complete
        run: |
          python3 -I - <<'PY'
          import glob, json, os, zipfile
          mirror = "website/public/skills/rust-curl-impersonate-native"
          assert os.path.isfile(f"{mirror}/SKILL.md"), "SKILL.md"
          assert os.path.isfile(f"{mirror}/.claude-plugin/plugin.json"), "plugin.json"
          for needed in ("references/api.md", "scripts/fetch_library.py",
                         "assets/python/rci_bindings.py", "assets/java/pom.xml"):
              assert os.path.isfile(os.path.join(mirror, needed)), needed
          # The entry point links repository documents by their published copy,
          # so an agent never needs raw.githubusercontent.com.
          for doc in ("README.md", "rci.h", "docs/embedding.md",
                      "docs/wrapper-guide.md", "docs/provider-protocol.md",
                      "bindings/README.md"):
              assert os.path.isfile(os.path.join("website/public", doc)), doc
          manifest = json.load(open("website/public/.claude-plugin/marketplace.json"))
          entry = manifest["plugins"][0]
          assert entry["source"]["source"] == "archive", entry["source"]
          assert entry["source"]["url"].startswith("https://"), entry["source"]
          archive = "website/public/rust-curl-impersonate-native.zip"
          names = zipfile.ZipFile(archive).namelist()
          for needed in (".claude-plugin/plugin.json", "SKILL.md"):
              assert needed in names, f"archive lacks {needed}"
          agent = open("website/public/agent.md").read()
          for url in ("agent.openapi.yaml", ".claude-plugin/marketplace.json",
                      "rust-curl-impersonate-native.zip"):
              assert url in agent, f"agent.md does not link {url}"
          print(f"{len(names)} files in the plugin archive, manifests agree")
          PY

      - name: Check the library is not empty
        run: |
          python3 -I - <<'PY'
          import json
          records = json.load(open("src/fingerprint/builtin.json"))["fingerprints"]
          real = [r for r in records if not r.get("extends")]
          assert len(real) >= 200, f"only {len(real)} captured records"
          families = {r.get("family", "") for r in real} - {""}
          assert len(families) >= 25, f"only {len(families)} families"
          print(f"{len(real)} captures over {len(families)} families")
          PY

  consumer:
    name: downstream consumer without patches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: crate
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@stable
      - name: Create a crate that only uses a path dependency
        run: |
          mkdir -p consumer/src
          cat > consumer/Cargo.toml <<'EOF'
          [package]
          name = "consumer"
          version = "0.0.0"
          edition = "2021"

          [dependencies]
          rust-curl-impersonate = { path = "../crate" }
          EOF
          cat > consumer/src/main.rs <<'EOF'
          fn main() {
              let profile = rust_curl_impersonate::Profile::find("chrome150")
                  .expect("chrome150 must exist");
              println!("profile={} target={}", profile.name(), profile.target());
          }
          EOF
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-consumer
          workspaces: consumer -> target
      - name: Build and run the consumer
        run: cd consumer && cargo run --quiet

  # The C ABI is what every non-Rust binding loads, so it gets its own gate:
  # the bytes a shared library exports, the header it ships, and a runtime
  # call through it. A shape change without a version bump fails here.
  ffi:
    name: C ABI (exports, header, smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-ffi
      - name: Build shared library
        run: cargo build -p rust-curl-impersonate-ffi --release
      # Every function in rci.h must be exported by the built library. The
      # header is hand-written, so this is what keeps the two in step.
      - name: Every declared function is exported
        run: |
          nm -D --defined-only target/release/librust_curl_impersonate_ffi.so \
            | awk '{print $3}' | sort > /tmp/exported.txt
          grep -oE 'rci_[a-z0-9_]+' bindings/ffi/rci.h | sort -u > /tmp/declared.txt
          echo "declared but not exported:"
          comm -23 /tmp/declared.txt /tmp/exported.txt | tee /tmp/missing.txt
          test ! -s /tmp/missing.txt
      - name: Exercise the ABI from Python
        run: |
          python3 -I bindings/ffi/python/testserver.py 8765 > /tmp/testserver.log 2>&1 &
          echo $! > /tmp/testserver.pid
          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1:8765/index.html >/dev/null && break
            sleep 0.5
          done
          python3 -I bindings/ffi/python/smoke.py
      # A C ABI has no reflection, so a binding knows the API only through the
      # header. This fails when rci.h grows a function that the Java binding
      # does not declare (and vice versa), before a downloader finds out.
      - name: Bindings agree with rci.h
        run: python3 -I tools/gen_signatures.py --check
      # The ready-made Python binding is what a downloader copies into their
      # project, so it gets a gate of its own: the ctypes signatures are read
      # from rci.h and the test asserts the fallback table matches it.
      - name: The shipped Python binding
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest bindings/ffi/python/tests -q
      # The Java binding ships in every archive; build it and run its tests
      # against the same local server, so a broken JNA declaration is caught
      # here rather than by a downloader.
      - name: The shipped Java binding
        run: |
          # A background process from an earlier step is not reliable; start
          # the test server fresh for this step.
          python3 -I bindings/ffi/python/testserver.py 8765 > /tmp/testserver-java.log 2>&1 &
          for _ in $(seq 1 20); do
            curl -sf http://127.0.0.1:8765/index.html >/dev/null && break
            sleep 0.5
          done
          cd bindings/ffi/java
          RCI_LIB=${{ github.workspace }}/target/release/librust_curl_impersonate_ffi.so \
            mvn -q -B test
      # HTTP/3 over the network is informational, not a gate: GitHub runners
      # drop outbound UDP on some pools, and a third-party QUIC peer
      # (quic.nginx.org) rate-limits by source IP and closes streams
      # intermittently, so a failure here proves nothing about the library.
      # The gate for HTTP/3 is offline: `tests/abi.rs::http3_response_maps_*`
      # pins the response shape, and `tests/wire.rs` decrypts real QUIC
      # Initials and asserts the ClientHello fields.
      - name: HTTP/3 against a public peer (informational)
        continue-on-error: true
        shell: bash
        run: |
          for profile in chrome152 firefox147; do
            RCI_H3_ADDR=quic.nginx.org:443 RCI_H3_PROFILE=$profile \
              python3 -I bindings/ffi/python/smoke.py 2>&1 \
              | grep 'http3 profile=' || true
          done
      - name: Header compiles as C and C++
        run: |
          printf '#include "rci.h"\nint main(void){return 0;}\n' > /tmp/hdr.c
          cc -Wall -Wextra -Werror -I bindings/ffi -o /tmp/hdr-c /tmp/hdr.c
          c++ -Wall -Wextra -Werror -I bindings/ffi -x c++ -o /tmp/hdr-cxx /tmp/hdr.c
      # The Windows release check reads the PE export table with this script;
      # a wrong RVA map would make it report zero exports, so test it here.
      - name: Test the PE export reader
        run: python3 -I scripts/test_peexports.py
