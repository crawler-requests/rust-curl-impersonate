name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the artifacts (without the v prefix)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-test
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    name: build ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-x86_64-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-aarch64-gnu
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-x86_64-musl
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-aarch64-musl
          - target: x86_64-apple-darwin
            os: macos-15-intel
            name: macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-15
            name: macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: windows-x86_64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            name: windows-arm64
          - target: aarch64-linux-android
            os: ubuntu-latest
            name: android-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Install cross toolchain (Linux gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          {
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
          } >> "$GITHUB_ENV"

      # Debian's musl-tools ships a C driver only; BoringSSL needs a C++
      # standard library for musl, which Zig provides. ziglang.org serves the
      # tarball slowly (tens of KB/s on some runners), so cache it across runs:
      # only a cache miss pays the ~57 MB download.
      - name: Restore Zig from cache
        id: zig-cache
        if: contains(matrix.target, '-linux-musl')
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/zig
          key: zig-0.17.1-x86_64-linux

      - name: Install Zig
        if: contains(matrix.target, '-linux-musl') && steps.zig-cache.outputs.cache-hit != 'true'
        run: |
          version=0.17.1
          url="https://ziglang.org/download/$version/zig-x86_64-linux-$version.tar.xz"
          # The server is slow rather than flaky; retry with a generous per-
          # attempt ceiling so a stalled transfer restarts instead of hanging.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 600 "$url" -o "$RUNNER_TEMP/zig.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig"

      - name: Put Zig on PATH
        if: contains(matrix.target, '-linux-musl')
        run: |
          zig_dir="$RUNNER_TEMP/zig/zig-x86_64-linux-0.17.1"
          echo "$zig_dir" >> "$GITHUB_PATH"
          # `ZIG_LIB` is `<zig>/lib`; the musl include paths below append
          # `libc/...` to it.
          echo "ZIG_LIB=$zig_dir/lib" >> "$GITHUB_ENV"
          test -x "$zig_dir/zig" || { echo "zig is not executable at $zig_dir"; ls -la "$RUNNER_TEMP/zig"; exit 1; }

      - name: Configure musl toolchain
        if: contains(matrix.target, '-linux-musl')
        run: |
          target="${{ matrix.target }}"
          arch="${target%%-*}"
          var="${target//-/_}"
          dir="$RUNNER_TEMP/zig-musl"
          mkdir -p "$dir"
          for kind in cc cxx; do
            if [ "$kind" = cxx ]; then zig_kind=c++; else zig_kind=cc; fi
            cat > "$dir/$kind" <<EOF
          #!/bin/bash
          # btls-sys forwards the Rust triple as a clang --target argument, which
          # zig's assembler rejects; zig already targets the right libc.
          filtered=()
          skip=0
          for arg in "\$@"; do
            if [ "\$skip" = 1 ]; then skip=0; continue; fi
            case "\$arg" in
              --target=*|-target=*) continue ;;
              -target) skip=1; continue ;;
              # rustc hands this GNU ld workaround to aarch64 linkers; zig's
              # lld rejects it.
              -Wl,--fix-cortex-a53-843419|--fix-cortex-a53-843419) continue ;;
            esac
            filtered+=("\$arg")
          done
          exec zig $zig_kind -target $arch-linux-musl "\${filtered[@]}"
          EOF
            chmod +x "$dir/$kind"
          done
          {
            echo "CC_$var=$dir/cc"
            echo "CXX_$var=$dir/cxx"
            echo "CARGO_TARGET_${var^^}_LINKER=$dir/cc"
            # A musl cdylib needs the dynamic loader; drop Rust's default
            # fully-static CRT for this target.
            echo "RUSTFLAGS=-C target-feature=-crt-static"
            # bindgen runs libclang with the Rust triple as --target, so it no
            # longer finds the host's glibc headers. Point it at the libc
            # headers Zig ships for this musl target instead. BORINGSSL_NO_CXX
            # keeps the C++ wrapper in base.h (which pulls in libstdc++) out of
            # the parse; the C API declarations are unaffected.
            includes="-DBORINGSSL_NO_CXX -I $ZIG_LIB/lib/include"
            includes="$includes -I $ZIG_LIB/libc/include/$arch-linux-musl"
            includes="$includes -I $ZIG_LIB/libc/include/generic-musl"
            includes="$includes -I $ZIG_LIB/libc/include/$arch-linux-any"
            includes="$includes -I $ZIG_LIB/libc/include/any-linux-any"
            echo "BINDGEN_EXTRA_CLANG_ARGS_$var=$includes"
          } >> "$GITHUB_ENV"

      - name: Configure Android NDK
        if: matrix.target == 'aarch64-linux-android'
        run: |
          ndk="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          [ -n "$ndk" ] || { echo "no Android NDK on this runner"; exit 1; }
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "ANDROID_NDK_HOME=$ndk"
            echo "ANDROID_NDK_ROOT=$ndk"
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android21-clang"
            echo "CXX_aarch64_linux_android=$bin/aarch64-linux-android21-clang++"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "RANLIB_aarch64_linux_android=$bin/llvm-ranlib"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android21-clang"
          } >> "$GITHUB_ENV"

      - name: Resolve version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The export check below reads the library's export table directly, so
      # it works on every runner without a platform linker tool on PATH.
      - name: Build
        shell: bash
        run: |
          # The echo smoke binary is a host tool; Android ships the library only.
          case "${{ matrix.target }}" in
            *android*) ;;
            *) cargo build --release -p rust-curl-impersonate --example echo --target ${{ matrix.target }} ;;
          esac
          cargo build --release -p rust-curl-impersonate-ffi --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          python scripts/package_artifact.py \
            --target "${{ matrix.target }}" \
            --version "$VERSION" \
            --out dist

      # The header and the shipped library must agree: every rci_ function the
      # header declares is in the library's dynamic export table.
      - name: Check exported symbols match rci.h
        shell: bash
        run: |
          release_dir="target/${{ matrix.target }}/release"
          case "${{ matrix.os }}" in
            *windows*)
              library="$release_dir/rust_curl_impersonate_ffi.dll"
              ;;
            *macos*)
              library="$release_dir/librust_curl_impersonate_ffi.dylib"
              ;;
            *)
              library="$release_dir/librust_curl_impersonate_ffi.so"
              ;;
          esac
          if [ ! -f "$library" ]; then
            echo "library not found: $library"
            find target -name '*rust_curl_impersonate_ffi*' -type f | head -20
            exit 1
          fi
          echo "library: $library"
          grep -oE 'rci_[a-z0-9_]+' bindings/ffi/rci.h | sort -u > /tmp/declared.txt
          case "${{ matrix.os }}" in
            *windows*)
              # Read the PE export directory directly: dumpbin needs an MSVC
              # developer prompt, which also shadows the Git Bash `link.exe`.
              python3 -I scripts/peexports.py "$library" \
                | grep -oE 'rci_[a-z0-9_]+' | sort -u > /tmp/exported.txt
              ;;
            *macos*)
              # Mach-O has no ELF dynamic symbol table; `nm -gU` lists the
              # defined external symbols, which is what a dylib exports.
              nm -gU "$library" | grep -oE 'rci_[a-z0-9_]+' | sort -u > /tmp/exported.txt
              ;;
            *)
              nm -D --defined-only "$library" | awk '{print $3}' | grep -oE 'rci_[a-z0-9_]+' \
                | sort -u > /tmp/exported.txt
              ;;
          esac
          echo "declared: $(wc -l < /tmp/declared.txt)  exported: $(wc -l < /tmp/exported.txt)"
          echo "declared but not exported:"
          comm -23 /tmp/declared.txt /tmp/exported.txt | tee /tmp/missing.txt
          test ! -s /tmp/missing.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          ls -l
          sha256sum *.tar.gz *.zip > SHA256SUMS
      # A release that ships fewer platforms than the matrix builds is a
      # silent regression; fail before publishing one.
      - name: Every target produced an archive
        run: |
          count=$(find dist -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)
          echo "archives: $count"
          test "$count" -eq 9
      # Every archive carries the header a binding compiles against. Check the
      # Linux/macOS tarballs here; Windows zips are checked in the matrix job.
      - name: Archives carry rci.h
        run: |
          for archive in dist/*.tar.gz; do
            tar -tzf "$archive" | grep -q 'include/rci.h' || {
              echo "$archive has no include/rci.h"; exit 1;
            }
          done
          for archive in dist/*.zip; do
            unzip -l "$archive" | grep -q 'rci.h' || {
              echo "$archive has no rci.h"; exit 1;
            }
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
