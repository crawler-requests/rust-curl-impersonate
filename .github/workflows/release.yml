name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for the artifacts (without the v prefix)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-test
      - run: cargo test --workspace

  build:
    name: build ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-x86_64-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-aarch64-gnu
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-x86_64-musl
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-aarch64-musl
          - target: x86_64-apple-darwin
            os: macos-15-intel
            name: macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-15
            name: macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: windows-x86_64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            name: windows-arm64
            experimental: true
          - target: aarch64-linux-android
            os: ubuntu-latest
            name: android-arm64
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Install cross toolchain (Linux gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          {
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
          } >> "$GITHUB_ENV"

      # Debian's musl-tools ships a C driver only; BoringSSL needs a C++
      # standard library for musl, which Zig provides.
      - name: Install Zig
        if: contains(matrix.target, '-linux-musl')
        run: |
          version=0.17.1
          url="https://ziglang.org/download/$version/zig-x86_64-linux-$version.tar.xz"
          curl -fsSL "$url" -o "$RUNNER_TEMP/zig.tar.xz"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-$version" >> "$GITHUB_PATH"
          echo "ZIG_LIB=$RUNNER_TEMP/zig-x86_64-linux-$version/lib" >> "$GITHUB_ENV"

      - name: Configure musl toolchain
        if: contains(matrix.target, '-linux-musl')
        run: |
          target="${{ matrix.target }}"
          arch="${target%%-*}"
          var="${target//-/_}"
          dir="$RUNNER_TEMP/zig-musl"
          mkdir -p "$dir"
          for kind in cc cxx; do
            if [ "$kind" = cxx ]; then zig_kind=c++; else zig_kind=cc; fi
            cat > "$dir/$kind" <<EOF
          #!/bin/bash
          # btls-sys forwards the Rust triple as a clang --target argument, which
          # zig's assembler rejects; zig already targets the right libc.
          filtered=()
          skip=0
          for arg in "\$@"; do
            if [ "\$skip" = 1 ]; then skip=0; continue; fi
            case "\$arg" in
              --target=*|-target=*) continue ;;
              -target) skip=1; continue ;;
            esac
            filtered+=("\$arg")
          done
          exec zig $zig_kind -target $arch-linux-musl "\${filtered[@]}"
          EOF
            chmod +x "$dir/$kind"
          done
          {
            echo "CC_$var=$dir/cc"
            echo "CXX_$var=$dir/cxx"
            echo "CARGO_TARGET_${var^^}_LINKER=$dir/cc"
            # A musl cdylib needs the dynamic loader; drop Rust's default
            # fully-static CRT for this target.
            echo "RUSTFLAGS=-C target-feature=-crt-static"
            # bindgen runs libclang with the Rust triple as --target, so it no
            # longer finds the host's glibc headers. Point it at the libc
            # headers Zig ships for this musl target instead. BORINGSSL_NO_CXX
            # keeps the C++ wrapper in base.h (which pulls in libstdc++) out of
            # the parse; the C API declarations are unaffected.
            includes="-DBORINGSSL_NO_CXX -I $ZIG_LIB/lib/include"
            includes="$includes -I $ZIG_LIB/libc/include/$arch-linux-musl"
            includes="$includes -I $ZIG_LIB/libc/include/generic-musl"
            includes="$includes -I $ZIG_LIB/libc/include/$arch-linux-any"
            includes="$includes -I $ZIG_LIB/libc/include/any-linux-any"
            echo "BINDGEN_EXTRA_CLANG_ARGS_$var=$includes"
          } >> "$GITHUB_ENV"

      - name: Configure Android NDK
        if: matrix.target == 'aarch64-linux-android'
        run: |
          ndk="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          [ -n "$ndk" ] || { echo "no Android NDK on this runner"; exit 1; }
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "ANDROID_NDK_HOME=$ndk"
            echo "ANDROID_NDK_ROOT=$ndk"
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android21-clang"
            echo "CXX_aarch64_linux_android=$bin/aarch64-linux-android21-clang++"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
            echo "RANLIB_aarch64_linux_android=$bin/llvm-ranlib"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android21-clang"
          } >> "$GITHUB_ENV"

      - name: Resolve version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          # The echo smoke binary is a host tool; Android ships the library only.
          case "${{ matrix.target }}" in
            *android*) ;;
            *) cargo build --release -p rust-curl-impersonate --example echo --target ${{ matrix.target }} ;;
          esac
          cargo build --release -p rust-curl-impersonate-ffi --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          python scripts/package_artifact.py \
            --target "${{ matrix.target }}" \
            --version "$VERSION" \
            --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          ls -l
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
