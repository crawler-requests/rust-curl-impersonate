name: Deploy website

# Builds the site in website/ and publishes it to GitHub Pages. Enable Pages
# once in the repository settings (Settings > Pages > Source: GitHub Actions);
# after that every push to main that touches website/ redeploys it.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "src/fingerprint/builtin.json"
      - "tools/capture/raw/**"
      - "goal-evidence/echo-latest/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        run: npm ci
        working-directory: website
      # The site shows what the crate ships, so its data file is regenerated
      # from the library rather than committed by hand.
      - name: Sync the fingerprint library
        run: node scripts/sync-library.mjs
        working-directory: website
      # The handshake panel shows cipher lists and extension orders, which the
      # library script does not carry; this one extracts them from the same
      # builtin.json and the captures it names.
      - name: Sync the handshake detail
        run: node scripts/sync-handshakes.mjs
        working-directory: website
      # And the live verification logs, so the /verification page shows the
      # most recent echo runs rather than a snapshot taken by hand.
      - name: Sync the verification runs
        run: node scripts/sync-echo.mjs
        working-directory: website
      - name: Build
        run: npm run build
        working-directory: website
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
